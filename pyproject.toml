[project]
name = "pia"
version = "0.8.1"
description = "Personal Intelligence Agency (PIA) Core"
dependencies = [
    "psycopg2-binary==2.9.12",
    "pydantic==2.13.5",
    "python-dotenv==1.2.1",
    "loguru==0.7.3",
    "sqlalchemy==2.0.52",
    "geoalchemy2==0.17.1",
    "requests==2.32.5",
    "fastmcp==2.14.7",
    "openai==2.48.0",
    "jinja2==3.1.6",
    "python-telegram-bot==22.5",
    "PyMuPDF==1.26.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "black>=24.2.0",
    "mypy>=1.8.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
markers = ["integration: needs the live docker stack (run with: pytest -m integration tests/integration)"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Real errors only for now (undefined names, syntax, unused imports); style rules can follow.
select = ["F", "E9"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
