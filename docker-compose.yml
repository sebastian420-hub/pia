services:
  postgres:
    build: ./infra/postgres
    container_name: pia_postgres
    restart: always
    environment:
      POSTGRES_USER: pia
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: pia
    ports:
      # Bound to the host's loopback only; never reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      # timescaledb-ha keeps its cluster under /home/postgres/pgdata/data, NOT the stock
      # /var/lib/postgresql/data. Mounting the wrong path left every row in the container's
      # writable layer, and two container recreations (2026-09-18, 2026-09-19) wiped the database.
      - pia_pgdata:/home/postgres/pgdata/data
    command: >
      postgres
      -c shared_preload_libraries='timescaledb'
      -c max_connections=200
      -c shared_buffers=1GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pia -d pia"]
      interval: 10s
      timeout: 5s
      retries: 5

  pia_init:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: pia_init
    volumes:
      - .:/app
    command: ["python", "scripts/validate_system.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - PGPASSWORD=${DB_PASSWORD:-password}
    depends_on:
      postgres:
        condition: service_healthy

  seismic_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: seismic_agent
    restart: always
    volumes:
      - .:/app
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
    depends_on:
      pia_init:
        condition: service_completed_successfully

  news_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: news_agent
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/news_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
    depends_on:
      pia_init:
        condition: service_completed_successfully

  analyst_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    deploy:
      replicas: 3
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/analyst_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_MODEL_POOL=${LLM_MODEL_POOL:-}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - WIKIDATA_MIN_INTERVAL_SEC=${WIKIDATA_MIN_INTERVAL_SEC:-1.0}
    depends_on:
      pia_init:
        condition: service_completed_successfully

  enrichment_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: enrichment_agent
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/enrichment_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_MODEL_POOL=${LLM_MODEL_POOL:-}
      - WIKIDATA_MIN_INTERVAL_SEC=${WIKIDATA_MIN_INTERVAL_SEC:-1.0}
    depends_on:
      pia_init:
        condition: service_completed_successfully

  maritime_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: maritime_agent
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/maritime_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      # Register free at https://www.aishub.net/join — no credit card required.
      # Leave empty to have the agent skip polls gracefully.
      - AISHUB_USERNAME=${AISHUB_USERNAME:-}
    depends_on:
      pia_init:
        condition: service_completed_successfully


  aviation_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: aviation_agent
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/aviation_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      # OpenSky Network — anonymous access works with no credentials.
      # Add an account for a higher rate limit: https://opensky-network.org/index.php?option=com_users&view=registration
      - OPENSKY_USERNAME=${OPENSKY_USERNAME:-}
      - OPENSKY_PASSWORD=${OPENSKY_PASSWORD:-}
    depends_on:
      pia_init:
        condition: service_completed_successfully


  document_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: document_agent
    restart: always
    volumes:
      - .:/app
      - ./data/documents:/app/data/documents
    command: ["python", "src/pia/agents/document_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - DOC_DIR=/app/data/documents
    depends_on:
      pia_init:
        condition: service_completed_successfully

  reader_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: reader_agent
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/reader_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - READER_DAILY_BUDGET=${READER_DAILY_BUDGET:-400}
    depends_on:
      pia_init:
        condition: service_completed_successfully

  connector_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: connector_agent
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/connector_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      # OpenSanctions datasets to pull nightly (free for non-commercial use): sanctions,peps
      - OPENSANCTIONS_DATASETS=${OPENSANCTIONS_DATASETS:-sanctions}
      # GLEIF ownership register: seed-and-grow from the LEIs the web holds (0 = off)
      - GLEIF_ENABLED=${GLEIF_ENABLED:-1}
      - GLEIF_HOPS=${GLEIF_HOPS:-2}
      - GLEIF_FUNDS=${GLEIF_FUNDS:-0}
      - GLEIF_CACHE=/app/data/gleif
      - CONNECTORS_EVERY_SEC=${CONNECTORS_EVERY_SEC:-86400}
    depends_on:
      pia_init:
        condition: service_completed_successfully

  gdelt_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: gdelt_agent
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/gdelt_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - GDELT_MIN_MENTIONS=${GDELT_MIN_MENTIONS:-3}
      - GDELT_MIN_ABS_GOLDSTEIN=${GDELT_MIN_ABS_GOLDSTEIN:-5}
    depends_on:
      pia_init:
        condition: service_completed_successfully

  camera_agent:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: camera_agent
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/agents/camera_agent.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      # comma-separated subset of providers, empty = all
      - CAMERA_PROVIDERS=${CAMERA_PROVIDERS:-}
      - CAMERA_LIST_REFRESH_MIN=${CAMERA_LIST_REFRESH_MIN:-60}
      # US relay for NYC / Caltrans (optional)
      - RELAY_URL=${RELAY_URL:-}
      - RELAY_TOKEN=${RELAY_TOKEN:-}
    depends_on:
      pia_init:
        condition: service_completed_successfully

  mcp_server:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: mcp_server
    restart: always
    volumes:
      - .:/app
    command: ["python", "src/pia/api/mcp_server.py"]
    ports:
      # No auth on MCP: only ever expose it on the host's loopback.
      - "127.0.0.1:${MCP_PORT:-8000}:8000"
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - MCP_HOST=0.0.0.0
    depends_on:
      pia_init:
        condition: service_completed_successfully

  telegram_voice:
    build:
      context: .
      dockerfile: ./infra/agents/Dockerfile
    container_name: telegram_voice
    restart: always
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - .:/app
    command: ["python", "src/pia/api/telegram_voice.py"]
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ALLOWED_TELEGRAM_USER_IDS=${ALLOWED_TELEGRAM_USER_IDS}
    depends_on:
      pia_init:
        condition: service_completed_successfully

  api_bridge:
    build:
      context: ../pia-api
      dockerfile: Dockerfile
    container_name: pia_api_bridge
    restart: always
    ports:
      - "8001:8001"
    volumes:
      # Same host folder the document_agent watches
      - ./data/documents:/app/data/documents
    environment:
      - DB_HOST=postgres
      - DB_USER=pia
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_NAME=pia
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-openai/text-embedding-3-small}
      - PIA_API_TOKEN=${PIA_API_TOKEN}
      - FRONTEND_ORIGINS=${FRONTEND_ORIGINS:-http://localhost:5173}
      - DOC_DIR=/app/data/documents
      - RELAY_URL=${RELAY_URL:-}
      - RELAY_TOKEN=${RELAY_TOKEN:-}
      - RELAY_START_CMD=${RELAY_START_CMD:-}
      - RELAY_STOP_CMD=${RELAY_STOP_CMD:-}
      - LIVE_IDLE_MINUTES=${LIVE_IDLE_MINUTES:-15}
      - LIVE_COST_PER_HOUR_USD=${LIVE_COST_PER_HOUR_USD:-0.01}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pia_pgdata:
